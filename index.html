<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Riptide Rush</title>
  <meta name="description" content="Riptide Rush: a neon-abyss arena slasher. You are a blade-fish. Dash through enemies, chain kills, and keep your combo alive.">
  <meta name="theme-color" content="#050a18">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Riptide Rush">
  <meta property="og:title" content="Riptide Rush">
  <meta property="og:description" content="Dash through the neon abyss. Every kill refunds a dash, so the faster you chain, the bigger the combo.">
  <meta property="og:url" content="https://omkarbhale.github.io/riptide-rush/">
  <meta property="og:image" content="https://omkarbhale.github.io/riptide-rush/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Riptide Rush: a glowing cyan blade-fish dashing through a dark neon abyss">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Riptide Rush">
  <meta name="twitter:description" content="Dash through the neon abyss. Every kill refunds a dash, so the faster you chain, the bigger the combo.">
  <meta name="twitter:image" content="https://omkarbhale.github.io/riptide-rush/assets/social-preview.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #02050d;
      --arena: #050a18;
      --gold: #ffe066;
      --cyan: #3cf2ff;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      /* Taps and drags belong to the game: no scroll, no pinch or double-tap zoom, no selection. */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      outline: none;
      background: var(--arena);
      cursor: crosshair;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Loading and click-to-start: a small pill. It never takes pointer events, so the first click or tap
       reaches the game underneath, and that gesture is what unlocks audio. */
    .splash {
      position: fixed;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 102, 0.35);
      background: rgba(5, 10, 24, 0.72);
      color: var(--gold);
      font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 0.4s ease;
    }
    .splash.gone {
      opacity: 0;
    }
    .splash.hidden {
      display: none;
    }

    /* Fullscreen: a small corner button. On touch screens it sits top-left, where the pause button is not. */
    .page-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin: 0;
      padding: 0;
      border: 1px solid rgba(60, 242, 255, 0.35);
      border-radius: 10px;
      background: rgba(5, 10, 24, 0.7);
      color: var(--cyan);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .page-btn:hover {
      border-color: var(--cyan);
    }
    .page-btn:focus {
      outline: none;
    }
    .page-btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }
    .page-btn svg {
      width: 22px;
      height: 22px;
      pointer-events: none;
    }
    .page-btn[hidden] {
      display: none;
    }
    @media (pointer: coarse) {
      .page-btn {
        top: 12px;
        right: auto;
        left: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="-1" aria-label="Riptide Rush play area"></canvas>

  <div class="splash" id="splash" role="status" aria-live="polite">Loading</div>

  <button type="button" class="page-btn" id="fullscreen" data-ui aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen (F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="fs-enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      <path class="fs-exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" style="display:none"/>
    </svg>
  </button>

  <noscript>Riptide Rush needs JavaScript and a canvas.</noscript>
  <script type="module" src="src/main.js"></script>
  <script>
    // Page chrome only: the click-to-start pill, fullscreen, and focus. The game itself is in src/.
    (function () {
      var canvas = document.getElementById('game');
      var splash = document.getElementById('splash');
      var fsBtn = document.getElementById('fullscreen');
      var root = document.documentElement;
      var coarse = false;
      try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) { coarse = false; }

      // Loading state: the pill reads "Loading" until the page has loaded, then asks for a gesture.
      function setSplash(text) {
        splash.textContent = text;
      }
      function dismissSplash() {
        if (splash.classList.contains('gone')) return;
        splash.classList.add('gone');
        setTimeout(function () { splash.classList.add('hidden'); }, 450);
        window.removeEventListener('pointerdown', dismissSplash, true);
        window.removeEventListener('keydown', dismissSplash, true);
      }
      var failed = false;
      window.addEventListener('load', function () {
        if (!failed) setSplash(coarse ? 'Tap to start' : 'Click or press a key to start');
      });
      window.addEventListener('pointerdown', dismissSplash, true);
      window.addEventListener('keydown', dismissSplash, true);
      // If the game fails to load or throws during start-up, say so instead of sitting on "Loading".
      window.addEventListener('error', function (e) {
        var failedScript = e && e.target && e.target.tagName === 'SCRIPT';
        var uncaught = e && e.target === window;
        if (!splash.classList.contains('gone') && (failedScript || uncaught)) {
          failed = true;
          setSplash('Could not start. Reload the page.');
        }
      }, true);

      // Keys work straight after a click: the canvas takes focus on press, and keys are read on the window.
      canvas.addEventListener('pointerdown', function () {
        try { canvas.focus({ preventScroll: true }); } catch (e) { /* focus is a nicety */ }
      });

      // Fullscreen: F key or the corner button.
      var canFullscreen = !!(root.requestFullscreen && document.fullscreenEnabled);
      if (!canFullscreen) fsBtn.hidden = true;
      var enterIcon = fsBtn.querySelector('.fs-enter');
      var exitIcon = fsBtn.querySelector('.fs-exit');
      function syncFullscreen() {
        var on = !!document.fullscreenElement;
        fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
        fsBtn.title = on ? 'Exit fullscreen (F)' : 'Fullscreen (F)';
        enterIcon.style.display = on ? 'none' : '';
        exitIcon.style.display = on ? '' : 'none';
      }
      function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            var exiting = document.exitFullscreen && document.exitFullscreen();
            if (exiting && exiting.catch) exiting.catch(function () {});
          } else {
            var entering = root.requestFullscreen && root.requestFullscreen();
            if (entering && entering.catch) entering.catch(function () {});
          }
        } catch (e) {
          // Fullscreen refused (iframe, policy, or no user gesture): the game keeps running windowed.
        }
      }
      fsBtn.addEventListener('click', function () {
        toggleFullscreen();
        // Give focus back to the game so Space keeps dashing and does not press this button.
        fsBtn.blur();
      });
      document.addEventListener('fullscreenchange', syncFullscreen);
      window.addEventListener('keydown', function (e) {
        if (e.code === 'KeyF' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFullscreen();
      });
      syncFullscreen();
    })();
  </script>
</body>
</html>
